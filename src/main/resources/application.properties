spring.application.name=AgendaPro
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/agendapro}
spring.datasource.username=${DB_USERNAME:agendapro}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/postgresql
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=none
app.jwt-secret=${JWT_SECRET}
app.token-minutes=60
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
