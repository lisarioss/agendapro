name: AgendaPro CI
on:
  push:
    paths-ignore: ['docs/**', 'README.md', 'VALIDATION.md']
  pull_request:
    paths-ignore: ['docs/**', 'README.md', 'VALIDATION.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: agendapro_test
          POSTGRES_USER: agendapro
          POSTGRES_PASSWORD: agendapro
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agendapro -d agendapro_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B -ntp verify -Dpg.tests=true
      - uses: actions/upload-artifact@v4
        with:
          name: agendapro
          path: target/agendapro-1.0.0.jar
  docker-smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: agendapro-test-ci
    steps:
      - uses: actions/checkout@v4
      - name: Gerar segredos efemeros de teste
        run: |
          printf 'DB_PASSWORD=%s\nJWT_SECRET=%s\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 48)" > .env
      - name: Construir e iniciar containers
        run: docker compose up --build -d
      - name: Verificar API e persistencia PostgreSQL
        run: python3 scripts/docker_smoke.py
      - name: Coletar diagnosticos em caso de falha
        if: failure()
        run: docker compose logs --no-color
      - name: Limpar ambiente efemero
        if: always()
        run: docker compose down -v
